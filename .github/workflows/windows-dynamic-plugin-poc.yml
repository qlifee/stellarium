name: Windows dynamic plugin proof

on:
  push:
    branches:
      - windows-dynamic-plugin-poc
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DIR: build-msvc
  INSTALL_DIR: stellarium-install
  PLUGIN_BUILD_DIR: dynamic-plugin-probe-build
  DIAG_DIR: diagnostics
  SDK_ARCHIVE_BASENAME: stellarium-26.2.0-plugin-sdk-windows-x64-msvc143-qt6.9.3-release-experimental
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  qt6-msvc-x64:
    name: Qt 6.9.3 / MSVC 2022 / x64 / Release
    runs-on: windows-2022
    timeout-minutes: 180

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out Stellarium
        uses: actions/checkout@v6

      - name: Install Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          modules: >-
            qt5compat qtcharts qtimageformats qtlocation qtmultimedia
            qtpositioning qtquicktimeline qtscxml qtsensors qtserialbus
            qtserialport qtshadertools qtspeech qtvirtualkeyboard
            qtwebchannel qtwebengine qtwebsockets qtwebview

      - name: Configure the DLL split
        run: |
          $ErrorActionPreference = 'Stop'
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR
          $sourceUrl = '{0}/{1}/commit/{2}' -f `
            $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_SHA
          $buildId = 'github-actions-{0}-{1}' -f `
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          cmake -S . -B $env:BUILD_DIR `
            -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_INSTALL_PREFIX=$installPrefix" `
            "-DSTELLARIUM_PLUGIN_SDK_SOURCE_REVISION=$env:GITHUB_SHA" `
            "-DSTELLARIUM_PLUGIN_SDK_SOURCE_URL=$sourceUrl" `
            "-DSTELLARIUM_PLUGIN_SDK_BUILD_ID=$buildId" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGENERATE_STELMAINLIB=ON `
            -DGENERATE_PACKAGE_TARGET=OFF `
            -DSTELLARIUM_RELEASE_BUILD=ON `
            -DSCM_SHOULD_ENABLE_CONVERTER=OFF `
            -DENABLE_TESTING=ON `
            -DENABLE_NLS=OFF `
            -DENABLE_PODIR=OFF
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }

      - name: Verify MSVC and patch-installer contracts
        run: |
          $ErrorActionPreference = 'Stop'

          $srcCmakePath = Join-Path $env:GITHUB_WORKSPACE `
            'src/CMakeLists.txt'
          $srcCmake = Get-Content -LiteralPath $srcCmakePath -Raw
          $definitions = [regex]::Matches(
            $srcCmake,
            'TARGET_COMPILE_DEFINITIONS\s*\(\s*stelMain\b')
          if ($definitions.Count -ne 1) {
            throw "Expected one stelMain compile-definition block; found $($definitions.Count)"
          }
          $sharedSetup = [regex]::Match(
            $srcCmake,
            '(?s)ADD_LIBRARY\s*\(\s*stelMain\s+SHARED\b' +
              '(?<body>.*?)TARGET_LINK_LIBRARIES\s*\(\s*stelMain\s+PUBLIC\b')
          if (-not $sharedSetup.Success) {
            throw 'Could not locate the shared stelMain target setup'
          }
          $definitionContract = '(?s)' +
            'TARGET_COMPILE_DEFINITIONS\s*\(\s*stelMain\s+' +
            'PRIVATE\s+STELMAIN_BUILD\s+' +
            'INTERFACE\s+\$\{STELLARIUM_PLUGIN_SDK_COMPILE_DEFINITIONS\}\s*\)'
          if ($sharedSetup.Groups['body'].Value -notmatch `
              $definitionContract) {
            throw 'The stelMain import/export definition block is malformed'
          }
          $cmakeDepth = 0
          $msvcDepth = 0
          $definitionsInsideMsvc = $false
          foreach ($line in ($sharedSetup.Groups['body'].Value -split '\r?\n')) {
            if ($line -match '^\s*IF\s*\(') {
              $cmakeDepth++
              if ($line -match '^\s*IF\s*\(\s*MSVC\s*\)') {
                $msvcDepth = $cmakeDepth
              }
            }
            if ($msvcDepth -gt 0 -and
                $line -match 'TARGET_COMPILE_DEFINITIONS\s*\(\s*stelMain') {
              $definitionsInsideMsvc = $true
            }
            if ($line -match '^\s*ENDIF\s*\(') {
              if ($msvcDepth -eq $cmakeDepth) {
                $msvcDepth = 0
              }
              $cmakeDepth--
            }
          }
          if (-not $definitionsInsideMsvc) {
            throw 'stelMain import/export definitions are not scoped to MSVC'
          }

          $stelMainProject = Get-ChildItem -Path $env:BUILD_DIR `
            -Recurse -File -Filter 'stelMain.vcxproj' |
            Select-Object -First 1
          $exeProject = Get-ChildItem -Path $env:BUILD_DIR `
            -Recurse -File -Filter 'stellarium.vcxproj' |
            Select-Object -First 1
          if (-not $stelMainProject -or
              (Get-Content -LiteralPath $stelMainProject.FullName -Raw) `
                -notmatch '\bSTELMAIN_BUILD\b') {
            throw 'The MSVC stelMain project is missing STELMAIN_BUILD'
          }
          if (-not $exeProject -or
              (Get-Content -LiteralPath $exeProject.FullName -Raw) `
                -notmatch '\bSTELMAIN_USE_DLL\b') {
            throw 'The MSVC launcher is missing STELMAIN_USE_DLL'
          }

          foreach ($relativePath in @(
              'cmake/stellarium-patch.iss.cmake',
              'cmake/stellarium-patch.iss6.cmake')) {
            $template = Get-Content -LiteralPath `
              (Join-Path $env:GITHUB_WORKSPACE $relativePath) -Raw
            $count = [regex]::Matches(
              $template,
              [regex]::Escape('@ISS_PATCH_STELMAIN@')).Count
            if ($count -ne 1) {
              throw "$relativePath must contain the stelMain placeholder once; found $count"
            }
          }

          $cache = Get-Content -LiteralPath `
            (Join-Path $env:BUILD_DIR 'CMakeCache.txt') -Raw
          if ($cache -notmatch '(?m)^GENERATE_STELMAINLIB:BOOL=ON\r?$') {
            throw 'The packaging check requires GENERATE_STELMAINLIB=ON'
          }
          $patchPath = Join-Path $env:BUILD_DIR 'stellarium-patch.iss'
          if (-not (Test-Path -LiteralPath $patchPath -PathType Leaf)) {
            throw 'CMake did not generate stellarium-patch.iss'
          }
          $patch = Get-Content -LiteralPath $patchPath -Raw
          if ($patch.Contains('@ISS_PATCH_STELMAIN@')) {
            throw 'The generated patch contains an unresolved placeholder'
          }
          $patchLines = $patch -split '\r?\n'
          $exeLines = @($patchLines | Where-Object {
            $_ -match '^\s*Source:' -and
            $_ -match '[\\/]bin[\\/]stellarium\.exe' -and
            $_ -match 'DestDir:\s*"\{app\}"'
          })
          $dllLines = @($patchLines | Where-Object {
            $_ -match '^\s*Source:' -and
            $_ -match '[\\/]bin[\\/]\*stelMain\.dll' -and
            $_ -match 'DestDir:\s*"\{app\}"' -and
            $_ -match 'Flags:\s*ignoreversion'
          })
          if ($exeLines.Count -ne 1 -or $dllLines.Count -ne 1) {
            throw "Expected one launcher and one stelMain DLL patch entry; found $($exeLines.Count) and $($dllLines.Count)"
          }

          "Verified: MSVC owns the explicit DLL macros and the patch installer includes stelMain.dll." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: |
          cmake --build $env:BUILD_DIR --config Release --parallel 4 `
            --target fake-show-my-sky-client stellarium testDates testStelFileMgr
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Build and verify the packaged plug-in SDK
        id: plugin_sdk
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build $env:BUILD_DIR --config Release --parallel 4 `
            --target stellarium-plugin-sdk-archive
          if ($LASTEXITCODE -ne 0) {
            throw "SDK archive build failed with exit code $LASTEXITCODE"
          }

          $cache = Get-Content -LiteralPath `
            (Join-Path $env:BUILD_DIR 'CMakeCache.txt') -Raw
          $archiveMatch = [regex]::Match(
            $cache,
            '(?m)^STELLARIUM_PLUGIN_SDK_ARCHIVE:[^=]+=(.+?)\r?$')
          if (-not $archiveMatch.Success) {
            throw 'CMake did not publish the plug-in SDK archive path'
          }
          $archive = [IO.Path]::GetFullPath(
            $archiveMatch.Groups[1].Value)
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              (Get-Item -LiteralPath $archive).Length -eq 0) {
            throw "SDK archive is missing or empty: $archive"
          }
          if ((Split-Path -Leaf $archive) -cne `
              "$env:SDK_ARCHIVE_BASENAME.zip") {
            throw "Unexpected SDK archive name: $archive"
          }
          $archiveChecksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archiveChecksum -PathType Leaf)) {
            throw "SDK archive checksum is missing: $archiveChecksum"
          }
          $checksumLine = Get-Content -LiteralPath $archiveChecksum -Raw
          $checksumMatch = [regex]::Match(
            $checksumLine.Trim(),
            '^([0-9a-fA-F]{64})  (.+\.zip)$')
          if (-not $checksumMatch.Success -or
              $checksumMatch.Groups[2].Value -cne `
                (Split-Path -Leaf $archive)) {
            throw "Malformed SDK archive checksum: $checksumLine"
          }
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
            $archive).Hash.ToLowerInvariant()
          if ($archiveHash -cne `
              $checksumMatch.Groups[1].Value.ToLowerInvariant()) {
            throw 'SDK archive checksum does not match the ZIP'
          }

          $extractParent = Join-Path $env:RUNNER_TEMP `
            'Relocated Stellarium Plugin SDK'
          if (-not $extractParent.Contains(' ')) {
            throw 'The SDK relocation test path must contain a space'
          }
          if (Test-Path -LiteralPath $extractParent) {
            throw "The SDK relocation test path is not clean: $extractParent"
          }
          New-Item -ItemType Directory -Path $extractParent | Out-Null
          Expand-Archive -LiteralPath $archive `
            -DestinationPath $extractParent
          $topLevelEntries = @(Get-ChildItem -LiteralPath $extractParent `
            -Force)
          if ($topLevelEntries.Count -ne 1 -or
              -not $topLevelEntries[0].PSIsContainer -or
              $topLevelEntries[0].Name -cne $env:SDK_ARCHIVE_BASENAME) {
            throw 'SDK archive must contain exactly one expected top-level directory'
          }
          $sdkRoot = Join-Path $extractParent $env:SDK_ARCHIVE_BASENAME
          if (-not (Test-Path -LiteralPath $sdkRoot -PathType Container)) {
            throw "SDK archive has no expected top-level directory: $sdkRoot"
          }

          $expectedApiHeaders = @(
            'core/StelApp.hpp',
            'core/StelModule.hpp',
            'core/StelPluginAPI.hpp',
            'core/StelPluginInterface.hpp'
          )
          $expectedDependencyHeaders = @(
            'StelMainExport.hpp',
            'core/StelTextureTypes.hpp',
            'core/StelUtils.hpp',
            'core/VecMath.hpp'
          )
          $expectedHeaders = @(
            'StelMainExport.hpp',
            'core/StelApp.hpp',
            'core/StelModule.hpp',
            'core/StelPluginAPI.hpp',
            'core/StelPluginInterface.hpp',
            'core/StelTextureTypes.hpp',
            'core/StelUtils.hpp',
            'core/VecMath.hpp'
          )
          $expectedFiles = @(
            'COPYING',
            'MANIFEST.sha256',
            'README.md',
            'bin/stelMain.dll',
            'lib/cmake/Stellarium/StellariumConfig.cmake',
            'lib/cmake/Stellarium/StellariumConfigVersion.cmake',
            'lib/stelMain.lib',
            'share/stellarium/plugin-sdk/StellariumPluginBuildInfo.json'
          ) + @($expectedHeaders | ForEach-Object {
            "include/stellarium/$_"
          })
          $expectedFiles = @($expectedFiles | Sort-Object -CaseSensitive)
          $actualFiles = @(Get-ChildItem -LiteralPath $sdkRoot `
            -Recurse -File | ForEach-Object {
              [IO.Path]::GetRelativePath(
                $sdkRoot, $_.FullName).Replace('\', '/')
            } | Sort-Object -CaseSensitive)
          if ($actualFiles.Count -ne $expectedFiles.Count -or
              ($actualFiles -join "`n") -cne `
                ($expectedFiles -join "`n")) {
            throw "Unexpected SDK ZIP manifest.`nExpected:`n$($expectedFiles -join "`n")`nActual:`n$($actualFiles -join "`n")"
          }
          foreach ($relativePath in $actualFiles) {
            $path = Join-Path $sdkRoot $relativePath
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "SDK ZIP contains an empty file: $relativePath"
            }
          }

          $manifestPath = Join-Path $sdkRoot 'MANIFEST.sha256'
          $manifestEntries = @{}
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            $match = [regex]::Match(
              $line,
              '^([0-9a-fA-F]{64})  (.+)$')
            if (-not $match.Success) {
              throw "Malformed SDK checksum entry: $line"
            }
            $relativePath = $match.Groups[2].Value.Replace('\', '/')
            if ($manifestEntries.ContainsKey($relativePath)) {
              throw "Duplicate SDK checksum entry: $relativePath"
            }
            $manifestEntries[$relativePath] = `
              $match.Groups[1].Value.ToLowerInvariant()
          }
          $hashedFiles = @($expectedFiles | Where-Object {
            $_ -ne 'MANIFEST.sha256'
          })
          if ($manifestEntries.Count -ne $hashedFiles.Count) {
            throw 'The SDK checksum manifest has an unexpected entry count'
          }
          foreach ($relativePath in $hashedFiles) {
            if (-not $manifestEntries.ContainsKey($relativePath)) {
              throw "SDK checksum is missing: $relativePath"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
              (Join-Path $sdkRoot $relativePath)).Hash.ToLowerInvariant()
            if ($actualHash -cne $manifestEntries[$relativePath]) {
              throw "SDK checksum mismatch: $relativePath"
            }
          }

          $buildInfoPath = Join-Path $sdkRoot `
            'share/stellarium/plugin-sdk/StellariumPluginBuildInfo.json'
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw |
            ConvertFrom-Json
          $expectedBuildId = 'github-actions-{0}-{1}' -f `
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $expectedSourceUrl = '{0}/{1}/commit/{2}' -f `
            $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_SHA
          if ($buildInfo.sdk_format_version -ne 1 -or
              $buildInfo.artifact_kind -ne `
                'experimental-minimal-plugin-sdk' -or
              $buildInfo.stellarium_version -ne '26.2.0' -or
              $buildInfo.source_revision -ne $env:GITHUB_SHA -or
              $buildInfo.source_url -ne $expectedSourceUrl -or
              $buildInfo.source_tree_state -ne 'clean' -or
              $buildInfo.provenance_status -ne 'verified-clean' -or
              $buildInfo.package_build_id -ne $expectedBuildId -or
              $buildInfo.plugin_interface_iid -ne `
                'org.stellarium.StelPluginInterface/2.0' -or
              $buildInfo.architecture -ne 'x64' -or
              $buildInfo.compiler_id -ne 'MSVC' -or
              [string]::IsNullOrWhiteSpace(
                [string]$buildInfo.compiler_version) -or
              $buildInfo.msvc_toolset_version -ne '143' -or
              $buildInfo.qt_version -ne '6.9.3' -or
              $buildInfo.build_configuration -ne 'Release' -or
              $buildInfo.msvc_runtime -ne 'MultiThreadedDLL') {
            throw "Unexpected packaged SDK metadata: $($buildInfo | ConvertTo-Json -Compress)"
          }
          $expectedDefinitions = @(
            'ENABLE_SCRIPTING',
            'ENABLE_SPOUT',
            'NOMINMAX',
            'STD_EXECUTION_KNOWN',
            'STELMAIN_USE_DLL',
            'WIN32_LEAN_AND_MEAN',
            '_USE_MATH_DEFINES',
            '_WIN32_WINNT=0x0A00'
          )
          $expectedQtComponents = @('Core', 'Gui')
          if ((@($buildInfo.api_headers) -join "`n") -cne `
              ($expectedApiHeaders -join "`n") -or
              (@($buildInfo.dependency_headers) -join "`n") -cne `
              ($expectedDependencyHeaders -join "`n")) {
            throw 'The packaged SDK describes unexpected API header categories'
          }
          if ((@($buildInfo.installed_headers) -join "`n") -cne `
                ($expectedHeaders -join "`n") -or
              (@($buildInfo.supported_headers) -join "`n") -cne `
                ($expectedHeaders -join "`n")) {
            throw 'The packaged SDK describes an unexpected installed header surface'
          }
          $actualDefinitions = @($buildInfo.required_compile_definitions)
          if ($actualDefinitions.Count -ne $expectedDefinitions.Count) {
            throw 'The packaged SDK describes an unexpected definition count'
          }
          foreach ($definition in $expectedDefinitions) {
            if ($actualDefinitions -cnotcontains $definition) {
              throw "The packaged SDK omits compile definition $definition"
            }
          }
          if ((@($buildInfo.required_qt_components) -join "`n") -cne `
              ($expectedQtComponents -join "`n")) {
            throw 'The packaged SDK describes unexpected Qt components'
          }

          $snapshot = $buildInfo.core_state_snapshot
          if ($null -eq $snapshot -or
              $snapshot.operation -cne `
                'StelPluginAPI::getCoreStateSnapshot(const StelCore*)' -or
              $snapshot.return_type -cne 'QVariantMap' -or
              $snapshot.null_input_behavior -cne 'returns an empty map' -or
              [string]::IsNullOrWhiteSpace(
                [string]$snapshot.pointer_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$snapshot.thread_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$snapshot.abi_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$snapshot.layout_contract)) {
            throw 'The packaged SDK omits the core-state snapshot contract'
          }
          $expectedSnapshotFields = [ordered]@{
            schemaVersion = 'int'
            julianDayUt = 'double'
            julianDayTt = 'double'
            deltaTSeconds = 'double'
            utcOffsetHours = 'double'
            timeRateJdPerSecond = 'double'
            longitudeDegrees = 'double'
            latitudeDegrees = 'double'
            currentTimeZone = 'QString'
            locationTimeZone = 'QString'
            locationId = 'QString'
            planetName = 'QString'
            locationValid = 'bool'
            altitudeMeters = 'int'
          }
          $actualSnapshotFields = @(
            $snapshot.fields.PSObject.Properties.Name)
          if (($actualSnapshotFields -join "`n") -cne `
              (@($expectedSnapshotFields.Keys) -join "`n")) {
            throw 'The packaged SDK describes unexpected snapshot fields'
          }
          foreach ($field in $expectedSnapshotFields.Keys) {
            if ($snapshot.fields.$field -cne `
                $expectedSnapshotFields[$field]) {
              throw "The packaged SDK has the wrong type for snapshot field $field"
            }
          }

          $bodySnapshot = $buildInfo.solar_system_body_state_snapshot
          if ($null -eq $bodySnapshot -or
              $bodySnapshot.operation -cne `
                'StelPluginAPI::getSolarSystemBodyStateSnapshot(const StelCore*, const QString&)' -or
              $bodySnapshot.return_type -cne 'QVariantMap' -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.lookup_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.empty_result_behavior) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.pointer_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.thread_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.abi_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.layout_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.coordinate_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.size_contract) -or
              [string]::IsNullOrWhiteSpace(
                [string]$bodySnapshot.conditional_phase_contract)) {
            throw 'The packaged SDK omits the body-state snapshot contract'
          }
          $expectedBodyFields = [ordered]@{
            schemaVersion = 'int'
            englishName = 'QString'
            julianDayUt = 'double'
            julianDayTt = 'double'
            rightAscensionJ2000Degrees = 'double'
            declinationJ2000Degrees = 'double'
            azimuthGeometricDegrees = 'double'
            altitudeGeometricDegrees = 'double'
            distanceAu = 'double'
            angularDiameterUnscaledDegrees = 'double'
            aberrationEnabled = 'bool'
            topocentricCoordinatesEnabled = 'bool'
            phaseDataAvailable = 'bool'
          }
          $expectedPhaseFields = [ordered]@{
            illuminatedFraction = 'double'
            phaseAngleDegrees = 'double'
            elongationDegrees = 'double'
          }
          foreach ($fieldSet in @(
              [pscustomobject]@{
                Actual = $bodySnapshot.required_fields
                Expected = $expectedBodyFields
                Label = 'required body'
              },
              [pscustomobject]@{
                Actual = $bodySnapshot.conditional_phase_fields
                Expected = $expectedPhaseFields
                Label = 'conditional phase'
              })) {
            $actualNames = @($fieldSet.Actual.PSObject.Properties.Name)
            if (($actualNames -join "`n") -cne `
                (@($fieldSet.Expected.Keys) -join "`n")) {
              throw "The packaged SDK describes unexpected $($fieldSet.Label) fields"
            }
            foreach ($field in $fieldSet.Expected.Keys) {
              if ($fieldSet.Actual.$field -cne $fieldSet.Expected[$field]) {
                throw "The packaged SDK has the wrong type for $($fieldSet.Label) field $field"
              }
            }
          }
          foreach ($operation in @(
              'StelApp::getCore() as an opaque snapshot input',
              'StelPluginAPI::getCoreStateSnapshot(const StelCore*)',
              'StelPluginAPI::getSolarSystemBodyStateSnapshot(const StelCore*, const QString&)')) {
            if (@($buildInfo.validated_operations) -cnotcontains $operation) {
              throw "The packaged SDK omits validated operation $operation"
            }
          }
          foreach ($capability in @(
              'read-only current core time and location snapshot',
              'read-only current Solar System body state snapshot')) {
            if (@($buildInfo.validated_capabilities) -cnotcontains `
                $capability) {
              throw "The packaged SDK omits capability $capability"
            }
          }

          $configPath = Join-Path $sdkRoot `
            'lib/cmake/Stellarium/StellariumConfig.cmake'
          $config = (Get-Content -LiteralPath $configPath -Raw) `
            -replace '\\', '/'
          foreach ($forbiddenPath in @(
              (Join-Path $env:GITHUB_WORKSPACE $env:BUILD_DIR),
              (Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR))) {
            $normalizedPath = $forbiddenPath -replace '\\', '/'
            if ($config.IndexOf(
                $normalizedPath,
                [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Packaged CMake metadata leaked a build path: $forbiddenPath"
            }
          }

          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $actualFiles | Set-Content -LiteralPath `
            (Join-Path $diagnostics 'plugin-sdk-zip-manifest.txt') `
            -Encoding utf8
          Get-FileHash -Algorithm SHA256 -LiteralPath $archive |
            Format-List | Out-String | Set-Content -LiteralPath `
              (Join-Path $diagnostics 'plugin-sdk-zip-sha256.txt') `
              -Encoding utf8

          "STELLARIUM_SDK_ROOT=$sdkRoot" |
            Add-Content -LiteralPath $env:GITHUB_ENV
          "archive=$archive" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "checksum=$archiveChecksum" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "Verified: the exact SDK ZIP is self-described, checksummed, relocatable, and contains the expected minimal API including the read-only core and Solar System body-state facades." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Install
        run: |
          cmake --install $env:BUILD_DIR --config Release
          if ($LASTEXITCODE -ne 0) {
            throw "Install failed with exit code $LASTEXITCODE"
          }

      - name: Verify the installed plug-in SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          $sdkFiles = @(
            'COPYING',
            'README.md',
            'bin/stelMain.dll',
            'lib/stelMain.lib',
            'include/stellarium/StelMainExport.hpp',
            'include/stellarium/core/StelApp.hpp',
            'include/stellarium/core/StelModule.hpp',
            'include/stellarium/core/StelPluginAPI.hpp',
            'include/stellarium/core/StelPluginInterface.hpp',
            'include/stellarium/core/StelTextureTypes.hpp',
            'include/stellarium/core/StelUtils.hpp',
            'include/stellarium/core/VecMath.hpp',
            'lib/cmake/Stellarium/StellariumConfig.cmake',
            'lib/cmake/Stellarium/StellariumConfigVersion.cmake',
            'share/stellarium/plugin-sdk/StellariumPluginBuildInfo.json'
          )
          foreach ($relativePath in $sdkFiles) {
            $path = Join-Path $installRoot $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed plug-in SDK file is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Installed plug-in SDK file is empty: $path"
            }
          }

          $buildInfoPath = Join-Path $installRoot `
            'share/stellarium/plugin-sdk/StellariumPluginBuildInfo.json'
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw |
            ConvertFrom-Json
          $expectedBuildId = 'github-actions-{0}-{1}' -f `
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $expectedSourceUrl = '{0}/{1}/commit/{2}' -f `
            $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_SHA
          if ($buildInfo.sdk_format_version -ne 1 -or
              $buildInfo.artifact_kind -ne `
                'experimental-minimal-plugin-sdk' -or
              $buildInfo.stellarium_version -ne '26.2.0' -or
              $buildInfo.source_revision -ne $env:GITHUB_SHA -or
              $buildInfo.source_url -ne $expectedSourceUrl -or
              $buildInfo.source_tree_state -ne 'clean' -or
              $buildInfo.provenance_status -ne 'verified-clean' -or
              $buildInfo.package_build_id -ne $expectedBuildId -or
              $buildInfo.plugin_interface_iid -ne `
                'org.stellarium.StelPluginInterface/2.0' -or
              $buildInfo.architecture -ne 'x64' -or
              $buildInfo.compiler_id -ne 'MSVC' -or
              [string]::IsNullOrWhiteSpace(
                [string]$buildInfo.compiler_version) -or
              $buildInfo.msvc_toolset_version -ne '143' -or
              $buildInfo.qt_version -ne '6.9.3' -or
              $buildInfo.build_configuration -ne 'Release' -or
              $buildInfo.msvc_runtime -ne 'MultiThreadedDLL') {
            throw "Unexpected plug-in ABI metadata: $($buildInfo | ConvertTo-Json -Compress)"
          }

          $configPath = Join-Path $installRoot `
            'lib/cmake/Stellarium/StellariumConfig.cmake'
          $config = Get-Content -LiteralPath $configPath -Raw
          foreach ($requiredText in @(
              'Stellarium::stelMain',
              'find_dependency(Qt6 6.9.3 EXACT COMPONENTS',
              'Stellarium_PLUGIN_SDK_HEADERS',
              'Stellarium_PLUGIN_SDK_REQUIRED_COMPILE_DEFINITIONS')) {
            if (-not $config.Contains($requiredText)) {
              throw "Installed CMake package is missing: $requiredText"
            }
          }
          if ($config -notmatch 'INTERFACE_COMPILE_DEFINITIONS') {
            throw 'Installed CMake package has no consumer definitions'
          }
          foreach ($definition in @(
              'STELMAIN_USE_DLL',
              'ENABLE_SCRIPTING',
              'ENABLE_SPOUT',
              '_USE_MATH_DEFINES',
              '_WIN32_WINNT=0x0A00')) {
            if (-not $config.Contains($definition)) {
              throw "Installed CMake package omits $definition"
            }
          }

          $packagedRoot = $env:STELLARIUM_SDK_ROOT
          foreach ($relativePath in $sdkFiles) {
            $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
              (Join-Path $installRoot $relativePath)).Hash
            $packagedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
              (Join-Path $packagedRoot $relativePath)).Hash
            if ($installedHash -cne $packagedHash) {
              throw "Packaged and installed SDK files differ: $relativePath"
            }
          }

          "Verified: the installed SDK contains the required public headers, read-only core and Solar System body-state facades, DLL/import library, and version-locked CMake metadata." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Verify DLL, import library, and exports
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          $exe = Join-Path $installRoot 'bin/stellarium.exe'
          $dll = Join-Path $installRoot 'bin/stelMain.dll'
          $importLibrary = Join-Path $installRoot 'lib/stelMain.lib'

          foreach ($path in @($exe, $dll, $importLibrary)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build artifact is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Required build artifact is empty: $path"
            }
          }

          $dumpbin = $null
          $mainCache = Get-Content -LiteralPath `
            (Join-Path $env:BUILD_DIR 'CMakeCache.txt') -Raw
          $linkerMatch = [regex]::Match(
            $mainCache,
            '(?m)^CMAKE_LINKER:FILEPATH=(.+?)\r?$')
          if ($linkerMatch.Success) {
            $candidate = Join-Path `
              (Split-Path -Parent $linkerMatch.Groups[1].Value) `
              'dumpbin.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $dumpbin = $candidate
            }
          }
          if (-not $dumpbin) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $dumpbin = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
              Select-Object -First 1
          }
          if (-not $dumpbin) {
            throw 'Unable to locate dumpbin.exe'
          }

          function Invoke-Dumpbin {
            param(
              [string] $OutputPath,
              [string[]] $Arguments
            )

            $output = & $dumpbin @Arguments 2>&1
            $exitCode = $LASTEXITCODE
            $output | Set-Content -LiteralPath $OutputPath -Encoding utf8
            if ($exitCode -ne 0) {
              throw "dumpbin failed with exit code $exitCode"
            }
          }

          $exeDependencies = Join-Path $diagnostics 'stellarium-dependencies.txt'
          $dllDependencies = Join-Path $diagnostics 'stelMain-dependencies.txt'
          $dllExports = Join-Path $diagnostics 'stelMain-exports.txt'
          $importMembers = Join-Path $diagnostics 'stelMain-import-library.txt'

          Invoke-Dumpbin $exeDependencies @('/DEPENDENTS', $exe)
          Invoke-Dumpbin $dllDependencies @('/DEPENDENTS', $dll)
          Invoke-Dumpbin $dllExports @('/EXPORTS', $dll)
          Invoke-Dumpbin $importMembers @('/LINKERMEMBER:1', $importLibrary)

          if (-not (Select-String -LiteralPath $exeDependencies -Pattern 'stelMain\.dll')) {
            throw 'stellarium.exe does not depend on stelMain.dll'
          }

          foreach ($symbolOwner in @('StelApp', 'StelModule', 'StelTranslator')) {
            if (-not (Select-String -LiteralPath $dllExports -Pattern $symbolOwner)) {
              throw "No exported symbol containing $symbolOwner was found"
            }
          }
          foreach ($apiSymbol in @(
              'isInitialized@StelApp',
              'getInstance@StelApp',
              'getModule@StelApp',
              'getCore@StelApp',
              'getCoreStateSnapshot@StelPluginAPI',
              'getSolarSystemBodyStateSnapshot@StelPluginAPI')) {
            if (-not (Select-String -LiteralPath $dllExports `
                -SimpleMatch $apiSymbol) -or
                -not (Select-String -LiteralPath $importMembers `
                -SimpleMatch $apiSymbol)) {
              throw "The DLL/import library omits $apiSymbol"
            }
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $exe, $dll, $importLibrary |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -LiteralPath (Join-Path $diagnostics 'sha256.txt') -Encoding utf8

          "Verified: stellarium.exe loads stelMain.dll." | Add-Content $env:GITHUB_STEP_SUMMARY
          "Verified: stelMain.lib exists for external MSVC consumers." | Add-Content $env:GITHUB_STEP_SUMMARY
          "Verified: required Stellarium symbol families and the read-only core and Solar System body-state facades are exported." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build the standalone plug-in from the packaged SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureSource = Join-Path $env:RUNNER_TEMP `
            'dynamic-plugin-probe-source'
          New-Item -ItemType Directory -Force -Path $fixtureSource | Out-Null
          Copy-Item -Path `
            (Join-Path $env:GITHUB_WORKSPACE 'tests/plugin-sdk/*') `
            -Destination $fixtureSource -Recurse -Force

          $sdkRoot = $env:STELLARIUM_SDK_ROOT
          if (-not $sdkRoot -or
              -not (Test-Path -LiteralPath $sdkRoot -PathType Container)) {
            throw 'The extracted SDK root is unavailable'
          }
          $stellariumDir = Join-Path $sdkRoot 'lib/cmake/Stellarium'
          cmake -S $fixtureSource -B $env:PLUGIN_BUILD_DIR `
            -G 'Visual Studio 17 2022' -A x64 `
            "-DStellarium_DIR=$stellariumDir" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
            throw "External plug-in configure failed with exit code $LASTEXITCODE"
          }

          $externalCache = Join-Path $env:PLUGIN_BUILD_DIR 'CMakeCache.txt'
          $cacheText = (Get-Content -LiteralPath $externalCache -Raw) `
            -replace '\\', '/'
          $sourceTreePath = (Join-Path $env:GITHUB_WORKSPACE 'src') `
            -replace '\\', '/'
          if ($cacheText.Contains($sourceTreePath)) {
            throw 'The standalone plug-in leaked a Stellarium source-tree path'
          }
          $installTreePath = (Join-Path `
            $env:GITHUB_WORKSPACE $env:INSTALL_DIR) -replace '\\', '/'
          if ($cacheText.Contains($installTreePath)) {
            throw 'The standalone plug-in used the unarchived install tree'
          }
          $dirMatch = [regex]::Match(
            $cacheText,
            '(?m)^Stellarium_DIR:[^=]+=(.+?)\r?$')
          $expectedDir = $stellariumDir -replace '\\', '/'
          if (-not $dirMatch.Success -or
              -not $dirMatch.Groups[1].Value.Equals(
                $expectedDir,
                [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The standalone plug-in did not resolve the extracted SDK'
          }

          cmake --build $env:PLUGIN_BUILD_DIR --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) {
            throw "External plug-in build failed with exit code $LASTEXITCODE"
          }

          "Verified: a separate external project configured and built using only the unpacked SDK ZIP." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Inspect and load the standalone plug-in
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = $env:STELLARIUM_SDK_ROOT
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          $probeBin = Join-Path $env:PLUGIN_BUILD_DIR 'bin'
          $dynamicPlugin = Join-Path $probeBin 'libDynamicPluginProbe.dll'
          $statePlugin = Join-Path $probeBin 'libStellariumStateProbe.dll'
          $loader = Join-Path $probeBin 'StellariumPluginProbeLoader.exe'
          foreach ($path in @($dynamicPlugin, $statePlugin, $loader)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "External proof artifact is missing: $path"
            }
          }

          $externalCache = Get-Content -LiteralPath `
            (Join-Path $env:PLUGIN_BUILD_DIR 'CMakeCache.txt') -Raw
          $linkerMatch = [regex]::Match(
            $externalCache,
            '(?m)^CMAKE_LINKER:FILEPATH=(.+?)\r?$')
          if (-not $linkerMatch.Success) {
            throw 'Unable to identify the external plug-in linker'
          }
          $dumpbin = Join-Path `
            (Split-Path -Parent $linkerMatch.Groups[1].Value) `
            'dumpbin.exe'
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "Unable to locate matching dumpbin.exe: $dumpbin"
          }

          function Invoke-Dumpbin {
            param(
              [string] $OutputPath,
              [string[]] $Arguments
            )

            $output = & $dumpbin @Arguments 2>&1
            $exitCode = $LASTEXITCODE
            $output | Set-Content -LiteralPath $OutputPath -Encoding utf8
            if ($exitCode -ne 0) {
              throw "dumpbin failed with exit code $exitCode"
            }
          }

          $spoutDir = Join-Path $env:GITHUB_WORKSPACE 'util/spout2/x64'
          if (Test-Path -LiteralPath `
              (Join-Path $probeBin 'stelMain.dll') -PathType Leaf) {
            throw 'The probe build unexpectedly copied stelMain.dll locally'
          }
          $sdkBin = Join-Path $sdkRoot 'bin'
          $env:PATH = "$sdkBin;$env:QT_ROOT_DIR\bin;$spoutDir;$env:PATH"
          $probes = @(
            [pscustomobject]@{
              Id = 'DynamicPluginProbe'
              Path = $dynamicPlugin
              Initialize = $true
            },
            [pscustomobject]@{
              Id = 'StellariumStateProbe'
              Path = $statePlugin
              Initialize = $false
            }
          )
          foreach ($probe in $probes) {
            $dependencies = Join-Path $diagnostics `
              "$($probe.Id)-dependencies.txt"
            $imports = Join-Path $diagnostics "$($probe.Id)-imports.txt"
            $headers = Join-Path $diagnostics "$($probe.Id)-headers.txt"
            $exports = Join-Path $diagnostics "$($probe.Id)-exports.txt"
            Invoke-Dumpbin $dependencies @('/DEPENDENTS', $probe.Path)
            Invoke-Dumpbin $imports @('/IMPORTS', $probe.Path)
            Invoke-Dumpbin $headers @('/HEADERS', $probe.Path)
            Invoke-Dumpbin $exports @('/EXPORTS', $probe.Path)

            if (-not (Select-String -LiteralPath $dependencies `
                -Pattern 'stelMain\.dll')) {
              throw "$($probe.Id) does not depend on stelMain.dll"
            }
            if (-not (Select-String -LiteralPath $imports `
                -Pattern 'StelModule')) {
              throw "$($probe.Id) has no imported StelModule symbol"
            }
            if (-not (Select-String -LiteralPath $headers `
                -Pattern 'machine \(x64\)')) {
              throw "$($probe.Id) is not an x64 image"
            }
            if (-not (Select-String -LiteralPath $exports `
                -Pattern 'qt_plugin')) {
              throw "$($probe.Id) does not export Qt plug-in entry points"
            }
            if ($probe.Id -eq 'StellariumStateProbe') {
              foreach ($apiSymbol in @(
                  'isInitialized@StelApp',
                  'getInstance@StelApp',
                  'getModule@StelApp',
                  'getCore@StelApp',
                  'getCoreStateSnapshot@StelPluginAPI',
                  'getSolarSystemBodyStateSnapshot@StelPluginAPI')) {
                if (-not (Select-String -LiteralPath $imports `
                    -SimpleMatch $apiSymbol)) {
                  throw "StellariumStateProbe does not import $apiSymbol"
                }
              }
              foreach ($forbiddenApiSymbol in @(
                  'singleton@StelApp',
                  '@StelCore',
                  '@StelLocation',
                  '@SolarSystem',
                  '@Planet',
                  '@StelObject')) {
                if (Select-String -LiteralPath $imports `
                    -SimpleMatch $forbiddenApiSymbol) {
                  throw "StellariumStateProbe unexpectedly imports $forbiddenApiSymbol"
                }
              }
            }

            $loaderArguments = @($probe.Path, $probe.Id)
            if ($probe.Initialize) {
              $loaderArguments += '--initialize'
            }
            $loaderOutputPath = Join-Path $diagnostics `
              "$($probe.Id)-loader.txt"
            $loaderOutput = & $loader @loaderArguments 2>&1
            $loaderExitCode = $LASTEXITCODE
            $loaderText = $loaderOutput | Out-String
            [System.IO.File]::WriteAllText(
              $loaderOutputPath,
              [string] $loaderText)
            $loaderText | Write-Host
            if ($loaderExitCode -ne 0) {
              throw "$($probe.Id) loader failed with exit code $loaderExitCode"
            }
            $metadataMarker = 'STEL_PLUGIN_METADATA_OK {0} 26.2.0' -f `
              $probe.Id
            if (-not (Select-String -LiteralPath $loaderOutputPath `
                -SimpleMatch $metadataMarker)) {
              throw "$($probe.Id) loader did not report $metadataMarker"
            }
            if ($probe.Initialize -and
                -not (Select-String -LiteralPath $loaderOutputPath `
                -SimpleMatch 'STEL_DYNAMIC_PLUGIN_PROBE_INITIALIZED')) {
              throw 'DynamicPluginProbe did not initialize in the loader'
            }
            if (-not $probe.Initialize -and
                (Select-String -LiteralPath $loaderOutputPath `
                  -Pattern 'STEL_STATE_PROBE_(OK|FAILED)')) {
              throw 'The metadata-only loader unexpectedly initialized StellariumStateProbe'
            }
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath `
            $dynamicPlugin, $statePlugin, $loader |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -LiteralPath `
              (Join-Path $diagnostics 'plugin-proof-sha256.txt') `
              -Encoding utf8

          "Verified: both external plug-ins import stelMain.dll and load through Qt's plug-in interface; StellariumStateProbe uses only the tested StelApp and StelPluginAPI facade symbols for live core and Solar System body state." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Run DLL-linked smoke test
        run: |
          $spoutDir = Join-Path $env:GITHUB_WORKSPACE 'util/spout2/x64'
          $env:PATH = "$spoutDir;$env:PATH"
          ctest --test-dir $env:BUILD_DIR `
            -C Release `
            --output-on-failure `
            -R '^(testDates|testStelFileMgr)$'
          if ($LASTEXITCODE -ne 0) {
            throw "Focused tests failed with exit code $LASTEXITCODE"
          }

      - name: Run full Stellarium plug-in discovery
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          $runtimeRoot = Join-Path $env:RUNNER_TEMP `
            'stellarium-plugin-runtime'
          $userDir = Join-Path $env:RUNNER_TEMP 'stellarium-plugin-user'
          $pluginDir = Join-Path $userDir `
            'modules/StellariumStateProbe'
          New-Item -ItemType Directory -Force -Path `
            $runtimeRoot, $pluginDir | Out-Null

          Copy-Item -Path (Join-Path $installRoot 'bin/*') `
            -Destination $runtimeRoot -Recurse -Force
          Copy-Item -Path (Join-Path $installRoot 'qtstuff/*') `
            -Destination $runtimeRoot -Recurse -Force
          Copy-Item -Path `
            (Join-Path $installRoot 'share/stellarium/*') `
            -Destination $runtimeRoot -Recurse -Force
          Copy-Item -LiteralPath `
            (Join-Path $env:GITHUB_WORKSPACE 'data/qt.conf') `
            -Destination $runtimeRoot -Force
          Copy-Item -LiteralPath `
            (Join-Path $env:GITHUB_WORKSPACE `
              'util/spout2/x64/SpoutLibrary.dll') `
            -Destination $runtimeRoot -Force

          $plugin = Join-Path $env:PLUGIN_BUILD_DIR `
            'bin/libStellariumStateProbe.dll'
          Copy-Item -LiteralPath $plugin -Destination $pluginDir -Force

          $app = Join-Path $runtimeRoot 'stellarium.exe'
          $log = Join-Path $userDir 'plugin-integration.log'
          $sentinel = Join-Path $userDir 'state-probe.json'
          $standardOutput = Join-Path $userDir 'stellarium-stdout.txt'
          $standardError = Join-Path $userDir 'stellarium-stderr.txt'
          $env:STELLARIUM_DATA_ROOT = $runtimeRoot
          $env:STELLARIUM_STATE_PROBE_SENTINEL = $sentinel
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_PLUGIN_PATH = $runtimeRoot
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path `
            $runtimeRoot 'platforms'
          $env:PATH = "$runtimeRoot;$env:PATH"

          $appArguments = @(
            '--user-dir', $userDir,
            '--log-file', $log,
            '--full-screen', 'no',
            '--no-audio',
            '--low-graphics',
            '--sky-date', '20240118',
            '--sky-time', '12:00:00',
            '--dump-opengl-details'
          )
          $softwareOpenGL = Join-Path $runtimeRoot 'opengl32sw.dll'
          if (Test-Path -LiteralPath $softwareOpenGL -PathType Leaf) {
            $appArguments += '--mesa-mode'
            'software OpenGL (--mesa-mode)' |
              Set-Content -LiteralPath `
                (Join-Path $diagnostics 'stellarium-graphics-mode.txt') `
                -Encoding utf8
          } else {
            'runner OpenGL (opengl32sw.dll was not deployed)' |
              Set-Content -LiteralPath `
                (Join-Path $diagnostics 'stellarium-graphics-mode.txt') `
                -Encoding utf8
          }

          $process = Start-Process -FilePath $app `
            -ArgumentList $appArguments `
            -WorkingDirectory $runtimeRoot `
            -WindowStyle Hidden `
            -RedirectStandardOutput $standardOutput `
            -RedirectStandardError $standardError `
            -PassThru
          $completed = $process.WaitForExit(120000)
          if (-not $completed) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process.WaitForExit()
          }

          foreach ($result in @(
              @{ Source = $log; Name = 'stellarium-plugin-integration.log' },
              @{ Source = $sentinel; Name = 'state-probe.json' },
              @{
                Source = $standardOutput
                Name = 'stellarium-plugin-stdout.txt'
              },
              @{
                Source = $standardError
                Name = 'stellarium-plugin-stderr.txt'
              },
              @{
                Source = (Join-Path $userDir 'config.ini')
                Name = 'stellarium-plugin-config.ini'
              }
            )) {
            if (Test-Path -LiteralPath $result.Source -PathType Leaf) {
              Copy-Item -LiteralPath $result.Source `
                -Destination (Join-Path $diagnostics $result.Name) -Force
            }
          }

          if (-not $completed) {
            throw 'Stellarium did not exit within 120 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "Stellarium exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'Stellarium did not initialize StellariumStateProbe'
          }
          $state = Get-Content -LiteralPath $sentinel -Raw |
            ConvertFrom-Json
          if ($state.schema_version -ne 1 -or
              $state.probe_id -ne 'StellariumStateProbe' -or
              $state.status -ne 'ok' -or
              $state.stellarium_version -ne '26.2.0' -or
              $state.expected_stellarium_version -ne '26.2.0') {
            throw "Unexpected state probe result: $($state | ConvertTo-Json -Compress)"
          }
          foreach ($field in @(
              'version_matches',
              'app_initialized',
              'self_registered',
              'solar_system_available',
              'solar_system_identity_matches',
              'null_core_returns_empty',
              'core_state_available',
              'core_state_schema_matches',
              'core_state_types_match',
              'astronomy_values_valid',
              'ephemeris_relation_valid',
              'location_values_valid',
              'null_body_core_returns_empty',
              'empty_body_id_returns_empty',
              'unknown_body_returns_empty',
              'sun_state_available',
              'moon_state_available',
              'body_state_schema_matches',
              'body_identities_match',
              'body_state_types_match',
              'body_lookup_case_insensitive',
              'body_state_times_match',
              'body_position_values_valid',
              'sun_phase_unavailable',
              'moon_phase_available',
              'moon_phase_values_valid',
              'moon_phase_relation_valid',
              'location_valid')) {
            $property = $state.PSObject.Properties[$field]
            if ($null -eq $property -or
                $property.Value -isnot [bool] -or
                -not $property.Value) {
              throw "State probe field is not boolean true: $field"
            }
          }
          foreach ($field in @(
              'current_time_zone',
              'location_time_zone')) {
            $property = $state.PSObject.Properties[$field]
            if ($null -eq $property -or
                $property.Value -isnot [string]) {
              throw "State probe field is not a string: $field"
            }
          }
          foreach ($field in @('location_id', 'planet_name')) {
            $property = $state.PSObject.Properties[$field]
            if ($null -eq $property -or
                $property.Value -isnot [string] -or
                [string]::IsNullOrWhiteSpace($property.Value)) {
              throw "State probe field is not a nonempty string: $field"
            }
          }
          if ($state.sun_english_name -cne 'Sun' -or
              $state.moon_english_name -cne 'Moon') {
            throw 'State probe returned unexpected canonical body names'
          }
          foreach ($field in @(
              'aberration_enabled',
              'topocentric_coordinates_enabled')) {
            $property = $state.PSObject.Properties[$field]
            if ($null -eq $property -or
                $property.Value -isnot [bool]) {
              throw "State probe field is not boolean: $field"
            }
          }

          $numericTypeCodes = @(
            [TypeCode]::SByte,
            [TypeCode]::Byte,
            [TypeCode]::Int16,
            [TypeCode]::UInt16,
            [TypeCode]::Int32,
            [TypeCode]::UInt32,
            [TypeCode]::Int64,
            [TypeCode]::UInt64,
            [TypeCode]::Single,
            [TypeCode]::Double,
            [TypeCode]::Decimal
          )
          function Get-FiniteStateNumber {
            param([string] $Name)

            $property = $state.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) {
              throw "State probe numeric field is missing: $Name"
            }
            $typeCode = [Type]::GetTypeCode($property.Value.GetType())
            if ($typeCode -notin $numericTypeCodes) {
              throw "State probe field is not numeric: $Name"
            }
            $number = [double] $property.Value
            if ([double]::IsNaN($number) -or
                [double]::IsInfinity($number)) {
              throw "State probe field is not finite: $Name"
            }
            return $number
          }

          $julianDayUt = Get-FiniteStateNumber 'julian_day_ut'
          $julianDayTt = Get-FiniteStateNumber 'julian_day_tt'
          $deltaTSeconds = Get-FiniteStateNumber 'delta_t_seconds'
          $utcOffsetHours = Get-FiniteStateNumber 'utc_offset_hours'
          $timeRate = Get-FiniteStateNumber 'time_rate_jd_per_second'
          $longitude = Get-FiniteStateNumber 'longitude_degrees'
          $latitude = Get-FiniteStateNumber 'latitude_degrees'
          $altitude = Get-FiniteStateNumber 'altitude_meters'
          $sunRa = Get-FiniteStateNumber `
            'sun_right_ascension_j2000_degrees'
          $sunDec = Get-FiniteStateNumber `
            'sun_declination_j2000_degrees'
          $sunAz = Get-FiniteStateNumber `
            'sun_azimuth_geometric_degrees'
          $sunAlt = Get-FiniteStateNumber `
            'sun_altitude_geometric_degrees'
          $sunDistance = Get-FiniteStateNumber 'sun_distance_au'
          $sunDiameter = Get-FiniteStateNumber `
            'sun_angular_diameter_unscaled_degrees'
          $moonRa = Get-FiniteStateNumber `
            'moon_right_ascension_j2000_degrees'
          $moonDec = Get-FiniteStateNumber `
            'moon_declination_j2000_degrees'
          $moonAz = Get-FiniteStateNumber `
            'moon_azimuth_geometric_degrees'
          $moonAlt = Get-FiniteStateNumber `
            'moon_altitude_geometric_degrees'
          $moonDistance = Get-FiniteStateNumber 'moon_distance_au'
          $moonDiameter = Get-FiniteStateNumber `
            'moon_angular_diameter_unscaled_degrees'
          $moonIlluminatedFraction = Get-FiniteStateNumber `
            'moon_illuminated_fraction'
          $moonPhaseAngle = Get-FiniteStateNumber `
            'moon_phase_angle_degrees'
          $moonElongation = Get-FiniteStateNumber `
            'moon_elongation_degrees'

          if ($julianDayUt -le 0.0 -or $julianDayUt -gt 100000000.0 -or
              $julianDayTt -le 0.0 -or $julianDayTt -gt 100000000.0 -or
              [Math]::Abs($deltaTSeconds) -gt 86400.0 -or
              $utcOffsetHours -lt -24.0 -or $utcOffsetHours -gt 24.0 -or
              [Math]::Abs($timeRate) -gt 1.0 -or
              $longitude -lt -180.0 -or $longitude -gt 180.0 -or
              $latitude -lt -90.0 -or $latitude -gt 90.0 -or
              $altitude -lt -20000.0 -or $altitude -gt 100000.0) {
            throw "State probe values are outside plausible ranges: $($state | ConvertTo-Json -Compress)"
          }
          if ($sunRa -lt 0.0 -or $sunRa -ge 360.0 -or
              $moonRa -lt 0.0 -or $moonRa -ge 360.0 -or
              $sunDec -lt -90.0 -or $sunDec -gt 90.0 -or
              $moonDec -lt -90.0 -or $moonDec -gt 90.0 -or
              $sunAz -lt 0.0 -or $sunAz -ge 360.0 -or
              $moonAz -lt 0.0 -or $moonAz -ge 360.0 -or
              $sunAlt -lt -90.0 -or $sunAlt -gt 90.0 -or
              $moonAlt -lt -90.0 -or $moonAlt -gt 90.0 -or
              $sunDistance -le 0.0 -or $sunDistance -gt 1000000.0 -or
              $moonDistance -le 0.0 -or $moonDistance -gt 1000000.0 -or
              $sunDiameter -le 0.0 -or $sunDiameter -gt 180.0 -or
              $moonDiameter -le 0.0 -or $moonDiameter -gt 180.0 -or
              $moonIlluminatedFraction -lt 0.0 -or
              $moonIlluminatedFraction -gt 1.0 -or
              $moonPhaseAngle -lt 0.0 -or $moonPhaseAngle -gt 180.0 -or
              $moonElongation -lt 0.0 -or
              $moonElongation -gt 180.0) {
            throw "Body-state probe values are outside defined ranges: $($state | ConvertTo-Json -Compress)"
          }
          $expectedMoonIlluminatedFraction = 0.5 * (
            1.0 + [Math]::Cos(
              $moonPhaseAngle * [Math]::PI / 180.0))
          if ([Math]::Abs(
              $moonIlluminatedFraction -
              $expectedMoonIlluminatedFraction) -gt 1.0e-5) {
            throw 'Moon illumination and phase angle are inconsistent'
          }
          $expectedJulianDayTt = $julianDayUt + $deltaTSeconds / 86400.0
          if ([Math]::Abs($julianDayTt - $expectedJulianDayTt) -gt 1.0e-8) {
            throw 'State probe JD/JDE/Delta-T relation is inconsistent'
          }
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
            throw 'Stellarium did not create the integration log'
          }
          if (-not (Select-String -LiteralPath $log `
              -Pattern 'Loaded plugin.*StellariumStateProbe')) {
            throw 'Stellarium did not report loading StellariumStateProbe'
          }
          if (-not (Select-String -LiteralPath $log `
              -SimpleMatch 'STEL_STATE_PROBE_OK')) {
            throw 'Stellarium did not report the state API success marker'
          }
          if (Select-String -LiteralPath $log `
              -SimpleMatch 'STEL_STATE_PROBE_FAILED') {
            throw 'StellariumStateProbe reported a failed live API check'
          }
          if (Select-String -LiteralPath $log `
              -SimpleMatch "Couldn't load the dynamic library") {
            throw 'Stellarium reported a dynamic-library load failure'
          }

          "Verified: Stellarium discovered StellariumStateProbe, and the external plug-in read validated live application, astronomy-time, location, Sun, and Moon state through the packaged StelApp/StelPluginAPI facade before exiting cleanly." |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Collect build metadata
        if: always()
        run: |
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE $env:DIAG_DIR
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          $cache = Join-Path $env:BUILD_DIR 'CMakeCache.txt'
          if (Test-Path -LiteralPath $cache) {
            Copy-Item -LiteralPath $cache -Destination $diagnostics -Force
          }
          $externalCache = Join-Path $env:PLUGIN_BUILD_DIR 'CMakeCache.txt'
          if (Test-Path -LiteralPath $externalCache) {
            Copy-Item -LiteralPath $externalCache `
              -Destination (Join-Path $diagnostics `
                'StellariumPluginProbe-CMakeCache.txt') -Force
          }

          Get-ChildItem -Path $env:BUILD_DIR -Recurse -File `
            -Filter 'windeployqt*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName `
                -Destination (Join-Path $diagnostics $_.Name) -Force
            }

          $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
          $compilerPath = $null
          $compilerConfig = Get-ChildItem `
            -Path (Join-Path $env:BUILD_DIR 'CMakeFiles') `
            -Filter 'CMakeCXXCompiler.cmake' -Recurse -File |
            Select-Object -First 1
          if ($compilerConfig) {
            Copy-Item -LiteralPath $compilerConfig.FullName `
              -Destination (Join-Path $diagnostics `
                'CMakeCXXCompiler.cmake') -Force
            $compilerConfigText = Get-Content -LiteralPath `
              $compilerConfig.FullName -Raw
            $compilerMatch = [regex]::Match(
              $compilerConfigText,
              'set\(CMAKE_CXX_COMPILER "([^"]+)"\)')
            if ($compilerMatch.Success) {
              $compilerPath = $compilerMatch.Groups[1].Value
            }
          }
          $buildInfoPath = Join-Path `
            (Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_DIR) `
            'share/stellarium/plugin-sdk/StellariumPluginBuildInfo.json'
          $buildInfo = if (Test-Path -LiteralPath $buildInfoPath) {
            Get-Content -LiteralPath $buildInfoPath -Raw | ConvertFrom-Json
          } else {
            $null
          }
          $metadata = [ordered]@{
            runner = $env:ImageOS
            architecture = 'x64'
            configuration = 'Release'
            generator = 'Visual Studio 17 2022'
            qt_root = $env:QT_ROOT_DIR
            qt_version = if ($qmake) { & $qmake.Source -query QT_VERSION } else { $null }
            compiler_path = $compilerPath
            compiler_version = if ($buildInfo) {
              $buildInfo.compiler_version
            } else {
              $null
            }
            msvc_toolset_version = if ($buildInfo) {
              $buildInfo.msvc_toolset_version
            } else {
              $null
            }
          }
          $metadata | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $diagnostics 'build-metadata.json') -Encoding utf8

      - name: Upload validated plug-in SDK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SDK_ARCHIVE_BASENAME }}
          path: |
            ${{ steps.plugin_sdk.outputs.archive }}
            ${{ steps.plugin_sdk.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellarium-26.2-windows-dynamic-plugin-proof
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.INSTALL_DIR }}/bin/stellarium.exe
            ${{ env.INSTALL_DIR }}/bin/stelMain.dll
            ${{ env.INSTALL_DIR }}/lib/stelMain.lib
            ${{ env.DIAG_DIR }}/
